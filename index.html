    <!-- Google Tag Manager — DEFERRED.

         GTM and gtag both loaded here, and together they were the bulk of a
         measured ~684ms of blocking time on a cold load, which is a Core Web
         Vitals problem on exactly the mobile paper pages we care about ranking.

         GTM is the heavy one and carries no conversion tracking, so it now
         waits for the page to finish loading (or for the first real
         interaction, whichever comes first) before it injects itself. gtag
         below is deliberately NOT deferred: it fires the Google Ads conversion,
         and a deferred conversion ping is a conversion you may not record.

         dataLayer is still created synchronously, so anything that pushes to it
         before GTM arrives is queued and replayed rather than dropped. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d, s, l, i) {
        var loaded = false;
        function loadGTM() {
          if (loaded) return;
          loaded = true;
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        }
        /* Whichever comes first: the page is done, or the visitor touches
           something. The interaction listeners matter because a visitor who
           acts before load still needs their events recorded. */
        if (d.readyState === 'complete') {
          setTimeout(loadGTM, 0);
        } else {
          w.addEventListener('load', function () { setTimeout(loadGTM, 0); }, { once: true });
        }
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (e) {
          w.addEventListener(e, loadGTM, { once: true, passive: true });
        });
      })(window, document, 'script', 'dataLayer', 'GTM-KK8D28BG');
    </script>
    <!-- End Google Tag Manager -->
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F19DCXZM2J"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F19DCXZM2J');
    </script>

    <!-- viewport-fit=cover is load-bearing, not cosmetic: without it iOS Safari
         reports env(safe-area-inset-*) as 0, which silently disabled the home
         indicator and notch clearance at all eight call sites that use it
         (BottomNav, Chatbot FAB, PageContainer, WordmarkBleed, Navbar sheet,
         ProductTour, SearchControl, TeacherProfile's sticky CTA). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- Resource hints for better performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Every page on the site fetches from Supabase before it can render
         anything real, and this origin previously had no resource hint at
         all -- only the fonts did. %VITE_SUPABASE_URL% is Vite's built-in
         HTML env substitution, resolved at build time from the same env var
         the client already reads, so this can never point at a different
         host than the one actually used. Preconnect (not just dns-prefetch)
         because the payoff is real here: DNS + TCP + TLS for the first API
         call, done in parallel with the JS bundle downloading instead of
         serially after it. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- No canonical here, deliberately. This file is the template every route
         is served from, so a hardcoded value is the canonical that every one of
         the ~1,560 URLs declares before JavaScript runs -- and a homepage URL
         here told Google that all of them were duplicates of "/". That was
         fixed once for JS-executing clients (CanonicalTag + src/lib/canonical.ts)
         but the pre-JS declaration survived and is what non-rendering crawlers
         and social unfurlers read.
         Per-route canonicals are injected at build time by scripts/prerender.ts;
         CanonicalTag remains the client-side fallback. -->
