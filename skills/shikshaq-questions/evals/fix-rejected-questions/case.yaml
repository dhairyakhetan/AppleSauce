schema_version: "1.1"
name: fix-rejected-questions
expected_outcome: |
  The whole text again in one code block, with every problem fixed: the sentence answer cut to a short term, the Yes
  question turned into a True/False statement, the bracket note dropped, the wrong options separated by ";", the level
  in lower case, the Fill sentence no longer showing the answer, and Fill/Wrong/Level added where missing. The chapter
  and topic lines are unchanged, and the site's checker reads the result with no problems.
